[project]
name = "research-skill-hub"
version = "0.1.0"
description = "本地科研 Skill 信息导航站"
requires-python = ">=3.12"
dependencies = ["fastapi>=0.115,<1", "uvicorn>=0.34,<1", "httpx>=0.28,<1", "jinja2>=3.1,<4", "pyyaml>=6,<7", "python-dotenv>=1,<2"]

[project.scripts]
skill-hub = "skill_hub.main:run"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["skill_hub"]
[tool.hatch.build.targets.wheel.force-include]
"config" = "skill_hub/defaults"
"skill_hub" = "skill_hub"

[dependency-groups]
dev = ["pytest>=8,<10", "pytest-asyncio>=0.25,<2", "ruff>=0.11,<1"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = ["E501"]

[tool.uv]
# Rebuild after source, template or classification-rule edits.
cache-keys = [{ file = "pyproject.toml" }, { file = "skill_hub/**/*.py" }, { file = "skill_hub/templates/*.html" }, { file = "skill_hub/static/*" }, { file = "config/*.yaml" }]
